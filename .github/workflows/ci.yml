name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  plugins:
    runs-on: ubuntu-latest
    env:
      # phoedox-sdk is private for now: a token with read access is needed
      # (secret PHOEDOX_SDK_TOKEN). Not needed once the SDK repo is public.
      GOPRIVATE: github.com/phoedox
    steps:
      - name: Access to phoedox-sdk
        env: { TOKEN: "${{ secrets.PHOEDOX_SDK_TOKEN }}" }
        run: if [ -n "$TOKEN" ]; then git config --global url."https://x-access-token:${TOKEN}@github.com/phoedox/".insteadOf "https://github.com/phoedox/"; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - name: Build backends
        run: for d in plugins/*/backend; do GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o "$d/../backend.wasm" "./$d"; done
