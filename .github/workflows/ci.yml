name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - name: Build backends
        run: for d in plugins/*/backend; do GOOS=wasip1 GOARCH=wasm go build -o "$d/../backend.wasm" "./$d"; done
